<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Todos - Simple Todo List</title>
  <meta name="description" content="A simple, fast todo list web app. Add, edit, complete and filter tasks. Data is saved in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><path d='M26 52l16 16 32-34' fill='none' stroke='white' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#task-input">Skip to task input</a>

  <main class="app">
    <header class="app__header">
      <div>
        <h1 class="app__title">My Todos</h1>
        <p class="app__subtitle" id="date-label"></p>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" title="Toggle dark mode">
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <span class="sr-only">Toggle dark mode</span>
      </button>
    </header>

    <!-- Add task -->
    <form id="todo-form" class="composer" novalidate>
      <label class="sr-only" for="task-input">New task</label>
      <input
        id="task-input"
        class="composer__input"
        type="text"
        name="task"
        placeholder="What needs to be done?"
        maxlength="200"
        autocomplete="off"
        aria-describedby="form-error"
      />
      <button class="btn btn--primary" type="submit">Add task</button>
    </form>
    <p id="form-error" class="error" role="alert" hidden></p>

    <!-- Filters + bulk actions -->
    <section class="toolbar" aria-label="Task filters">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
      </div>
      <button id="clear-completed" class="btn btn--ghost" type="button">Clear done</button>
    </section>

    <!-- Task list -->
    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty" hidden></p>

    <footer class="app__footer">
      <span id="items-left" class="app__footer-count">0 tasks</span>
      <span class="app__footer-hint">Double-click a task to rename it. Saved in this browser.</span>
    </footer>

    <p id="live-region" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <template id="todo-template">
    <li class="todo">
      <input class="todo__checkbox" type="checkbox" />
      <span class="todo__text" tabindex="-1"></span>
      <input class="todo__edit" type="text" maxlength="200" hidden />
      <span class="todo__actions">
        <button class="icon-btn todo__rename" type="button" title="Rename task">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
          </svg>
          <span class="sr-only">Rename task</span>
        </button>
        <button class="icon-btn icon-btn--danger todo__delete" type="button" title="Delete task">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 11v6M14 11v6" />
          </svg>
          <span class="sr-only">Delete task</span>
        </button>
      </span>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
